<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إلى عمر</title>
    <style>
        body { margin: 0; background: #050505; color: #d4af37; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .container { z-index: 10; padding: 20px; border: 2px solid #d4af37; border-radius: 15px; background: rgba(0,0,0,0.6); box-shadow: 0 0 30px #d4af37; }
        h1 { font-size: 3rem; margin: 0; letter-spacing: 5px; animation: glow 2s infinite alternate; }
        p { font-size: 1.5rem; margin-top: 10px; }
        @keyframes glow { from { text-shadow: 0 0 10px #d4af37; } to { text-shadow: 0 0 30px #d4af37; } }
        canvas { position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="container">
        <h1>إلى عمر</h1>
        <p>أنا أعشقك بكل ما في الكلمة من معنى.</p>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        let particles = [];
        function createParticle() {
            return { x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 3, speedY: Math.random() * 2 };
        }
        for(let i=0; i<100; i++) particles.push(createParticle());
        function animate() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            ctx.fillStyle = '#d4af37';
            particles.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
                p.y += p.speedY; if(p.y > canvas.height) p.y = 0;
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
