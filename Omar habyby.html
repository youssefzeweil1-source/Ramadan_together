<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى عمر الغالي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a1a;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* خلفية الأنوار المتحركة */
        .background {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(0, 229, 255, 0.1);
            animation: float 8s infinite ease-in-out alternate;
        }

        .circle:nth-child(1) { width: 200px; height: 200px; top: 10%; left: 10%; animation-delay: 0s; }
        .circle:nth-child(2) { width: 300px; height: 300px; bottom: 15%; right: 10%; background: rgba(255, 0, 127, 0.1); animation-delay: 2s; }
        .circle:nth-child(3) { width: 150px; height: 150px; top: 50%; left: 70%; background: rgba(147, 51, 234, 0.1); animation-delay: 4s; }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-30px) scale(1.1); }
        }

        /* حاوية المحتوى الرئيسي */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { text-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff; }
            50% { text-shadow: 0 0 20px #ff007f, 0 0 40px #ff007f; }
        }

        p {
            color: #ccc;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* زر المفاجأة المضيء */
        .btn {
            background: linear-gradient(45deg, #00e5ff, #ff007f);
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0, 229, 255, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 25px rgba(255, 0, 127, 0.6);
        }

        /* الرسالة المخفية والأنيميشن الخاص بها */
        .hidden-message {
            display: none;
            margin-top: 25px;
            color: #fff;
            font-size: 1.3rem;
            font-weight: bold;
            animation: popUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popUp {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="background">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <div class="card">
        <h1>يا عمر!</h1>
        <p>هذا الكود مبرمج خصيصاً لك بشكل مميز، اضغط على الزر بالأسفل لرؤية المفاجأة...</p>
        <button class="btn" onclick="revealMessage()">اضغط هنا</button>
        <div class="hidden-message" id="msg">
            أنا أحبك جداً يا صاحبي! 🌟
        </div>
    </div>

    <script>
        function revealMessage() {
            var msg = document.getElementById("msg");
            msg.style.display = "block";
        }
    </script>

</body>
</html>
